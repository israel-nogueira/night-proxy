<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>shadow-proxy — Test Suite</title>
	<link
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap"
		rel="stylesheet">
	<script src="./shadow-proxy.js"></script>
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--bg: #0a0a0f;
			--bg2: #111118;
			--bg3: #1a1a24;
			--border: #2a2a3a;
			--accent: #7c3aed;
			--accent2: #06b6d4;
			--danger: #ef4444;
			--success: #22c55e;
			--warn: #f59e0b;
			--text: #e2e8f0;
			--text2: #94a3b8;
			--text3: #475569;
			--font-mono: 'JetBrains Mono', monospace;
			--font-display: 'Syne', sans-serif;
		}

		body {
			background: var(--bg);
			color: var(--text);
			font-family: var(--font-mono);
			padding: 24px 16px;
		}

		h1 {
			font-family: var(--font-display);
			font-size: 1.5rem;
			margin-bottom: 6px;
		}

		h1 span {
			color: var(--accent);
		}

		.subtitle {
			color: var(--text2);
			font-size: 0.75rem;
			margin-bottom: 24px;
		}

		.controls {
			display: flex;
			gap: 12px;
			margin-bottom: 24px;
			flex-wrap: wrap;
		}

		button {
			background: var(--accent);
			color: #fff;
			border: none;
			padding: 10px 20px;
			border-radius: 6px;
			font-family: var(--font-mono);
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
			transition: filter 0.15s;
		}

		button:hover {
			filter: brightness(1.2);
		}

		button.secondary {
			background: var(--bg3);
			border: 1px solid var(--border);
			color: var(--text);
		}

		.summary {
			display: flex;
			gap: 16px;
			flex-wrap: wrap;
			margin-bottom: 20px;
			padding: 16px 20px;
			background: var(--bg2);
			border: 1px solid var(--border);
			border-radius: 10px;
		}

		.summary-item {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.summary-label {
			font-size: 0.65rem;
			color: var(--text3);
			text-transform: uppercase;
			letter-spacing: 0.1em;
		}

		.summary-value {
			font-size: 1.5rem;
			font-weight: 700;
			font-family: var(--font-display);
		}

		.summary-value.pass {
			color: var(--success);
		}

		.summary-value.fail {
			color: var(--danger);
		}

		.summary-value.total {
			color: var(--text);
		}

		.progress-bar {
			height: 4px;
			background: var(--bg3);
			border-radius: 2px;
			margin-bottom: 24px;
			overflow: hidden;
		}

		.progress-fill {
			height: 100%;
			background: var(--success);
			transition: width 0.3s;
		}

		/* ── Grid de cards ── */
		.groups {
			display: grid;
			gap: 16px;
			grid-template-columns: 1fr;
		}

		@media (min-width: 768px) {
			.groups {
				grid-template-columns: repeat(2, 1fr);
			}
		}

		@media (min-width: 1200px) {
			.groups {
				grid-template-columns: repeat(3, 1fr);
			}
		}

		.group {
			background: var(--bg2);
			border: 1px solid var(--border);
			border-radius: 10px;
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}

		.group-header {
			padding: 12px 16px;
			background: var(--bg3);
			border-bottom: 1px solid var(--border);
			display: flex;
			align-items: center;
			gap: 10px;
			font-family: var(--font-display);
			font-size: 0.82rem;
			font-weight: 600;
		}

		.group-badge {
			margin-left: auto;
			font-size: 0.7rem;
			font-family: var(--font-mono);
			color: var(--text2);
			white-space: nowrap;
		}

		.group-progress {
			height: 3px;
			background: var(--bg3);
		}

		.group-progress-fill {
			height: 100%;
			background: var(--accent);
			transition: width 0.3s;
			width: 0%;
		}

		.test-list {
			padding: 4px 0;
			flex: 1;
		}

		.test-item {
			display: flex;
			align-items: flex-start;
			gap: 10px;
			padding: 8px 16px;
			border-bottom: 1px solid var(--border);
			font-size: 0.75rem;
		}

		.test-item:last-child {
			border-bottom: none;
		}

		.test-icon {
			font-size: 0.85rem;
			margin-top: 1px;
			flex-shrink: 0;
		}

		.test-name {
			flex: 1;
			color: var(--text);
			line-height: 1.4;
		}

		.test-detail {
			font-size: 0.68rem;
			color: var(--text2);
			margin-top: 2px;
		}

		.test-time {
			font-size: 0.62rem;
			color: var(--text3);
			flex-shrink: 0;
			margin-top: 2px;
			white-space: nowrap;
		}

		.test-error {
			font-size: 0.68rem;
			color: var(--danger);
			margin-top: 3px;
			font-family: var(--font-mono);
			word-break: break-all;
		}

		.status-pass .test-icon::before {
			content: '✓';
			color: var(--success);
		}

		.status-fail .test-icon::before {
			content: '✕';
			color: var(--danger);
		}

		.status-pending .test-icon::before {
			content: '○';
			color: var(--text3);
		}

		.status-running .test-icon::before {
			content: '◌';
			color: var(--warn);
		}

		.status-pass {
			background: rgba(34, 197, 94, .03);
		}

		.status-fail {
			background: rgba(239, 68, 68, .05);
		}

		#test-targets {
			position: absolute;
			left: -9999px;
			top: 0;
			width: 1px;
			overflow: hidden;
		}
	</style>
</head>

<body>

	<!-- ═══════════════════════════════════════════════════════════
     DOM TARGETS — componentes ocultos usados pelos testes
═══════════════════════════════════════════════════════════ -->
	<div id="test-targets">

		<!-- x-bind -->
		<div x-data="t_bind">
			<span class="titulo" x-bind="titulo"></span>
			<span class="count" x-bind="count"></span>
			<span class="bool-true" x-bind="boolTrue"></span>
			<span class="bool-false" x-bind="boolFalse"></span>
			<span class="zero" x-bind="zero"></span>
			<span class="nulo" x-bind="nulo"></span>
			<span class="undef" x-bind="undef"></span>
			<a class="href-link" href="{linkHref}">link</a>
			<div class="cls-div" class="{divClass}"></div>
			<span class="data-val" data-id="{dataId}"></span>
			<div class="nested-wrap"><span class="nested-span" x-bind="nested"></span></div>
		</div>

		<!-- x-for básico -->
		<div x-data="t_lista">
			<div x-for="item in lista">
				<div class="item" x-bind="{item.nome}"></div>
			</div>
		</div>

		<!-- x-for — alias de índice -->
		<div x-data="t_for_idx">
			<div x-for="item, k in lista">
				<span class="idx-item" x-bind="{k}:{item.nome}"></span>
			</div>
		</div>

		<!-- x-for — alias "as" -->
		<div x-data="t_for_as">
			<div x-for="item in lista as k">
				<span class="as-item" x-bind="{k}:{item.nome}"></span>
			</div>
		</div>

		<!-- x-for — $i/$index -->
		<div x-data="t_for_i">
			<div x-for="item in lista">
				<span class="i-item" x-bind="{$i}"></span>
			</div>
		</div>

		<!-- x-for — x-key -->
		<div x-data="t_for_key">
			<div x-for="item in lista" x-key="item.id">
				<span class="key-item" x-bind="{item.nome}"></span>
			</div>
		</div>

		<!-- x-for — multi-filho -->
		<div x-data="t_for_multi">
			<div x-for="item in lista">
				<span class="mf-a" x-bind="{item.a}"></span>
				<span class="mf-b" x-bind="{item.b}"></span>
			</div>
		</div>

		<!-- x-for aninhado -->
		<div x-data="t_nested">
			<div x-for="cat in lista">
				<div>
					<span class="cat-nome" x-bind="{cat.nome}"></span>
					<div x-for="tag in cat.tags">
						<span class="tag" x-bind="{tag.label}"></span>
					</div>
				</div>
			</div>
		</div>

		<!-- x-if -->
		<div x-data="t_if">
			<div x-for="item in lista">
				<div>
					<span class="nome" x-bind="{item.nome}"></span>
					<span class="ativo" x-if="item.ativo">sim</span>
					<span class="inativo" x-if="!item.ativo">não</span>
				</div>
			</div>
		</div>

		<!-- x-if — valores falsy -->
		<div x-data="t_if_falsy">
			<span class="if-zero" x-if="val_zero">zero</span>
			<span class="if-empty" x-if="val_empty">empty</span>
			<span class="if-null" x-if="val_null">null</span>
			<span class="if-and" x-if="val_a && val_b">and</span>
			<span class="if-or" x-if="val_a || val_b">or</span>
		</div>

		<!-- x-model -->
		<div x-data="t_model">
			<input type="text" x-model="t_model.nome">
			<input type="checkbox" x-model="t_model.ativo">
			<input type="radio" x-model="t_model.cor" value="red">
			<input type="radio" x-model="t_model.cor" value="blue">
			<select x-model="t_model.opcao">
				<option value="a">A</option>
				<option value="b">B</option>
			</select>
			<input type="text" x-model="t_model.nome" class="input2">
		</div>

		<!-- x-model — path profundo -->
		<div x-data="t_model_deep">
			<input type="text" x-model="t_model_deep.user.nome">
		</div>

		<!-- x-on -->
		<div x-data="t_on" x-ref="root-on">
			<span x-ref="saida"></span>
			<button class="btn-click" x-on:click="contador = contador + 1">+</button>
			<button class="btn-emit" x-on:click="$emit('meu-evento', { val: 42 })">emit</button>
			<button class="btn-multi-a" x-on:click="multi = 'click'" x-on:mouseenter="multi = 'enter'">multi</button>
			<span class="out-contador" x-bind="contador"></span>
			<span class="out-multi" x-bind="multi"></span>
		</div>

		<!-- x-on — $this dentro de x-for -->
		<div x-data="t_on_this">
			<div x-for="item in lista" x-key="item.id">
				<span class="this-nome" x-bind="{item.nome}"></span>
				<button class="btn-this" x-on:click="item.nome = 'clicado-' + $this.index">clica</button>
			</div>
		</div>

		<!-- x-ref -->
		<div x-data="t_ref">
			<span x-ref="meu-ref" class="ref-target">ref</span>
			<button class="btn-ref" x-on:click="$ref['meu-ref'].textContent = 'tocado'">toca ref</button>
		</div>

		<!-- stress -->
		<div x-data="t_stress">
			<div x-for="item in lista">
				<div class="stress-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_stress1k">
			<div x-for="item in lista">
				<div class="stress1k-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_stress5k">
			<div x-for="item in lista">
				<div class="stress5k-item" x-bind="{item.nome}"></div>
			</div>
		</div>

		<!-- listas simultâneas -->
		<div x-data="t_multi_a">
			<div x-for="item in lista">
				<div class="multi-a-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_multi_b">
			<div x-for="item in lista">
				<div class="multi-b-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_multi_c">
			<div x-for="item in lista">
				<div class="multi-c-item" x-bind="{item.nome}"></div>
			</div>
		</div>

		<!-- destroy -->
		<div x-data="t_destroy_a">
			<div x-for="item in lista">
				<div class="destroy-a-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_destroy_b">
			<span class="destroy-b-titulo" x-bind="titulo"></span>
		</div>
		<div x-data="t_destroy_on">
			<button class="btn-don" x-on:click="val = val + 1">+</button>
			<span class="out-don" x-bind="val"></span>
		</div>

		<!-- segurança -->
		<div x-data="t_security">
			<span class="sec-out" x-bind="out"></span>
			<button class="sec-btn-safe" x-on:click="out = 'clicked-safe'">safe</button>
			<button class="sec-btn-rce" x-on:click="out = constructor.constructor('return (1)')()">rce</button>
			<button class="sec-btn-eval" x-on:click="eval('1+1')">eval</button>
			<button class="sec-btn-fetch" x-on:click="fetch('/x')">fetch</button>
			<button class="sec-btn-window" x-on:click="window.x=1">window</button>
			<button class="sec-btn-settimeout" x-on:click="setTimeout(function(){},0)">timeout</button>
			<button class="sec-btn-proto" x-on:click="out.__proto__={}">proto</button>
			<button class="sec-btn-arrow" x-on:click="(()=>{ out='pwned' })()">arrow</button>
			<button class="sec-btn-math" x-on:click="out = String(Math.round(1.9))">math</button>
			<button class="sec-btn-ternary" x-on:click="out = out === 'antes' ? 'ternario-ok' : 'fail'">ternary</button>
			<button class="sec-btn-logical" x-on:click="out = out || 'logical-ok'">logical</button>
			<button class="sec-btn-getproto" x-on:click="out = Object.getPrototypeOf(out)">getproto</button>
		</div>

		<!-- segurança — retry de bind -->
		<div x-data="t_sec_retry">
			<button class="btn-retry" x-on:click="retryVal = 'ok'">retry</button>
			<span class="out-retry" x-bind="retryVal"></span>
		</div>

		<!-- x-model destroy -->
		<div x-data="t_model_destroy">
			<input type="text" x-model="t_model_destroy.nome">
		</div>

		<!-- x-model órfão (fora de qualquer x-data), usado no teste do fallback de _setDeep pós-destroy -->
		<input type="text" class="mf-orphan-input" x-model="t_setdeep_fallback.val">
		<div x-data="t_setdeep_fallback">
			<span class="mf-out" x-bind="val"></span>
		</div>

		<!-- __nid -->
		<div x-data="t_nid">
			<div x-for="item in lista">
				<div class="nid-item" x-bind="{item.nome}"></div>
			</div>
		</div>

		<!-- batch -->
		<div x-data="t_batch">
			<span class="batch-a" x-bind="{a} {b} {c}"></span>
		</div>

		<!-- watcher deep -->
		<div x-data="t_watch_deep">
			<span class="wd-out" x-bind="obj.sub.prop"></span>
		</div>

		<!-- proxy interno -->
		<div x-data="t_proxy_int">
			<span class="pi-out" x-bind="obj.level1.level2.val"></span>
		</div>

		<!-- lifecycle -->
		<div x-data="t_lifecycle">
			<span class="lc-out" x-bind="msg"></span>
		</div>

		<!-- dois componentes isolados -->
		<div x-data="t_iso_a"><span class="iso-a-out" x-bind="val"></span></div>
		<div x-data="t_iso_b"><span class="iso-b-out" x-bind="val"></span></div>

		<!-- ═══ NOVOS TARGETS — v2.6.1 ═══ -->

		<!-- x-for aninhado + x-if -->
		<div x-data="t_nested_if">
			<div x-for="cat in lista">
				<div>
					<span class="ni-cat" x-bind="{cat.nome}"></span>
					<div x-for="tag in cat.tags">
						<span class="ni-tag" x-if="tag.ativo" x-bind="{tag.label}"></span>
					</div>
				</div>
			</div>
		</div>
		<div x-data="t_if_item">
			<div x-for="item in lista" x-key="item.id">
				<span class="ifi-item" x-if="item.show" x-bind="{item.nome}"></span>
			</div>
		</div>

		<!-- x-for multi-filho raiz (regressão) -->
		<div x-data="t_multi_root" x-ref="mr-root">
			<div x-for="item in lista" x-key="item.id">
				<span class="mr-nome" x-bind="{item.nome}"></span>
				<span class="mr-idx" x-bind="{$this.index}"></span>
				<button class="mr-btn" x-on:click="item.nome = 'click-' + $this.index">clica</button>
			</div>
		</div>

		<!-- x-on — objeto/array literal -->
		<div x-data="t_on_literal" x-ref="ol-root">
			<button class="ol-btn-emit" x-on:click="$emit('ev-multi', { a: 1, b: 2, c: contador })">emit</button>
			<button class="ol-btn-push" x-on:click="lista.push({ id: 1 })">push</button>
			<button class="ol-btn-nested" x-on:click="$emit('ev-nested', { user: { nome: 'x' } })">nested</button>
			<button class="ol-btn-tern-obj"
				x-on:click="out = JSON.stringify({ val: flag ? 'a' : 'b' })">ternobj</button>
			<button class="ol-btn-tern-obj-block"
				x-on:click="out = JSON.stringify({ val: flag ? window : 'safe' })">ternobjblock</button>
			<button class="ol-btn-tern" x-on:click="out = flag ? 'sim' : 'nao'">tern</button>
			<span class="ol-out" x-bind="out"></span>
			<span class="ol-lista-len" x-bind="{lista.length}"></span>
		</div>

		<!-- interpolação de atributo — regressão + cobertura -->
		<div x-data="t_attr_multi">
			<a class="am-href" href="{ahref}">link</a>
			<img class="am-src" src="{asrc}">
			<span class="am-title" title="{atitle}"></span>
			<span class="am-multi" data-info="{a}-{b}"></span>
			<div id="am-class" class="{aclass}"></div>
		</div>

		<!-- destroy / recreate -->
		<div x-data="t_destroy_recreate">
			<span class="dr-out" x-bind="valor"></span>
		</div>
		<div x-data="t_destroy_pending">
			<span class="dp-out" x-bind="valor"></span>
		</div>
		<div x-data="t_destroy_on2">
			<button class="d2-btn" x-on:click="val = val + 1">+</button>
			<span class="d2-out" x-bind="val"></span>
		</div>

		<!-- x-model — cobertura adicional -->
		<div x-data="t_model_arr">
			<input type="text" class="ma-0" x-model="t_model_arr.itens.0">
			<input type="text" class="ma-1" x-model="t_model_arr.itens.1">
			<input type="text" class="ma-2" x-model="t_model_arr.itens.2">
		</div>
		<div x-data="t_model_for">
			<div x-for="item in lista">
				<input type="text" class="mf-input" x-model="item.valor">
			</div>
		</div>
		<div x-data="t_model_checks">
			<input type="checkbox" class="mc-a" x-model="t_model_checks.optA">
			<input type="checkbox" class="mc-b" x-model="t_model_checks.optB">
			<input type="checkbox" class="mc-c" x-model="t_model_checks.optC">
		</div>

		<!-- x-key — edge cases -->
		<div x-data="t_key_edge">
			<div x-for="item in lista" x-key="item.id">
				<span class="ke-item" x-bind="{item.nome}"></span>
			</div>
		</div>

		<!-- race conditions / timing -->
		<div x-data="t_race">
			<div x-for="item in lista">
				<div class="race-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_race2">
			<span class="race2-out" x-bind="val"></span>
		</div>
		<div x-data="t_race3">
			<span class="race3-out" x-bind="val"></span>
		</div>

		<!-- cache LRU — colisão entre componentes -->
		<div x-data="t_lru_a"><span class="lru-a-out" x-bind="{compartilhado}"></span></div>
		<div x-data="t_lru_b"><span class="lru-b-out" x-bind="{compartilhado}"></span></div>

		<!-- error handling / onError -->
		<div x-data="t_err_for">
			<div x-for="apenas_uma_palavra" class="ef-list"></div>
			<span class="ef-sibling" x-bind="outro"></span>
		</div>
		<div x-data="t_err_bind">

		</div>

	</div>

	<!-- ═══════════════ UI ═══════════════ -->
	<h1>shadow-proxy<span>.js</span> — Test Suite</h1>
	<p class="subtitle">v2.7.2 · testes automatizados de reatividade, segurança e edge cases</p>

	<div class="controls">
		<button onclick="runAll()">▶ Rodar todos</button>
		<button class="secondary" onclick="resetAll()">↺ Resetar</button>
	</div>

	<div class="summary">
		<div class="summary-item">
			<span class="summary-label">Total</span>
			<span class="summary-value total" id="s-total">0</span>
		</div>
		<div class="summary-item">
			<span class="summary-label">Pass</span>
			<span class="summary-value pass" id="s-pass">0</span>
		</div>
		<div class="summary-item">
			<span class="summary-label">Fail</span>
			<span class="summary-value fail" id="s-fail">0</span>
		</div>
		<div class="summary-item">
			<span class="summary-label">Tempo</span>
			<span class="summary-value total" id="s-time">—</span>
		</div>
	</div>

	<div class="progress-bar">
		<div class="progress-fill" id="progress" style="width:0%"></div>
	</div>

	<div class="groups" id="groups"></div>

	<script>
		// ══════════════════════════════════════════════════════════════
		//  ENGINE
		// ══════════════════════════════════════════════════════════════

		const _results = { pass: 0, fail: 0, total: 0 };
		const _groups = [];

		function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
		function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
		function getText(sel) { return document.querySelector(sel)?.textContent?.trim() ?? ''; }
		function getAll(sel) { return [...document.querySelectorAll(sel)]; }
		function group(name, tests) { _groups.push({ name, tests }); }

		// ══════════════════════════════════════════════════════════════
		//  UI BUILDER
		// ══════════════════════════════════════════════════════════════

		function buildUI() {
			const container = document.getElementById('groups');
			container.innerHTML = '';
			_groups.forEach((g, gi) => {
				const el = document.createElement('div');
				el.className = 'group';
				el.innerHTML = `
			<div class="group-header">
				${g.name}
				<span class="group-badge" id="gbadge-${gi}">— / ${g.tests.length}</span>
			</div>
			<div class="group-progress"><div class="group-progress-fill" id="gprog-${gi}"></div></div>
			<div class="test-list" id="glist-${gi}">
				${g.tests.map((t, ti) => `
					<div class="test-item status-pending" id="t-${gi}-${ti}">
						<span class="test-icon"></span>
						<div style="flex:1">
							<div class="test-name">${t.name}</div>
							<div class="test-detail" id="td-${gi}-${ti}"></div>
						</div>
						<span class="test-time" id="tt-${gi}-${ti}"></span>
					</div>
				`).join('')}
			</div>
		`;
				container.appendChild(el);
			});
			updateSummary();
		}

		function setTestStatus(gi, ti, status, detail, time) {
			const el = document.getElementById(`t-${gi}-${ti}`);
			el.className = `test-item status-${status}`;
			if (detail) document.getElementById(`td-${gi}-${ti}`).innerHTML =
				`<span class="${status === 'fail' ? 'test-error' : ''}">${detail}</span>`;
			if (time != null) document.getElementById(`tt-${gi}-${ti}`).textContent = `${time}ms`;
		}

		function updateGroupProgress(gi, pass, total) {
			const pct = total > 0 ? (pass / total * 100) : 0;
			const fill = document.getElementById(`gprog-${gi}`);
			if (fill) fill.style.width = pct + '%';
			fill.style.background = pct === 100 ? 'var(--success)' : pct > 0 ? 'var(--warn)' : 'var(--accent)';
		}

		function updateSummary() {
			document.getElementById('s-total').textContent = _results.total;
			document.getElementById('s-pass').textContent = _results.pass;
			document.getElementById('s-fail').textContent = _results.fail;
			const pct = _results.total > 0 ? (_results.pass / _results.total * 100) : 0;
			document.getElementById('progress').style.width = pct + '%';
		}

		// ══════════════════════════════════════════════════════════════
		//  RUNNER
		// ══════════════════════════════════════════════════════════════

		async function runAll() {
			_results.pass = 0; _results.fail = 0; _results.total = 0;
			buildUI();
			const start = performance.now();

			for (let gi = 0; gi < _groups.length; gi++) {
				const g = _groups[gi];
				let gPass = 0;

				for (let ti = 0; ti < g.tests.length; ti++) {
					const t = g.tests[ti];
					setTestStatus(gi, ti, 'running', '');
					await wait(30);
					const t0 = performance.now();
					try {
						await t.fn();
						const ms = Math.round(performance.now() - t0);
						setTestStatus(gi, ti, 'pass', 'ok', ms);
						_results.pass++; gPass++;
					} catch (e) {
						const ms = Math.round(performance.now() - t0);
						setTestStatus(gi, ti, 'fail', e.message, ms);
						_results.fail++;
					}
					_results.total++;
					updateSummary();
					updateGroupProgress(gi, gPass, ti + 1);
				}

				document.getElementById(`gbadge-${gi}`).textContent = `${gPass} / ${g.tests.length}`;
				updateGroupProgress(gi, gPass, g.tests.length);
			}

			document.getElementById('s-time').textContent = Math.round(performance.now() - start) + 'ms';
		}

		function resetAll() {
			_results.pass = 0; _results.fail = 0; _results.total = 0;
			buildUI();
			document.getElementById('s-time').textContent = '—';
		}

		// ══════════════════════════════════════════════════════════════
		//  INIT
		// ══════════════════════════════════════════════════════════════

		shadowProxy.initProxy();
		shadowProxy.initModels();

		// ══════════════════════════════════════════════════════════════
		//  HELPERS DE ACESSO AO DOM
		// ══════════════════════════════════════════════════════════════

		const T = (sel) => document.querySelector(`#test-targets ${sel}`);
		const TA = (sel) => [...document.querySelectorAll(`#test-targets ${sel}`)];

		function listItems() { return TA('[x-data="t_lista"] .item'); }
		function nestedCats() { return TA('[x-data="t_nested"] .cat-nome'); }
		function nestedTags() { return TA('[x-data="t_nested"] .tag'); }
		function ifAtivos() { return TA('[x-data="t_if"] .ativo'); }
		function ifInativos() { return TA('[x-data="t_if"] .inativo'); }
		function stressItems() { return TA('[x-data="t_stress"] .stress-item'); }
		function stress1kItems() { return TA('[x-data="t_stress1k"] .stress1k-item'); }
		function stress5kItems() { return TA('[x-data="t_stress5k"] .stress5k-item'); }
		function multiAItems() { return TA('[x-data="t_multi_a"] .multi-a-item'); }
		function multiBItems() { return TA('[x-data="t_multi_b"] .multi-b-item'); }

		function secOut() { return T('[x-data="t_security"] .sec-out'); }
		function secBtn(cls) { return T(`[x-data="t_security"] .${cls}`); }
		function modelDestroyInput() { return T('[x-data="t_model_destroy"] input'); }
		function nidItems() { return TA('[x-data="t_nid"] .nid-item'); }
		function batchOut() { return T('[x-data="t_batch"] .batch-a'); }
		function wdOut() { return T('[x-data="t_watch_deep"] .wd-out'); }
		function niCats() { return TA('[x-data="t_nested_if"] .ni-cat'); }
		function niTags() { return TA('[x-data="t_nested_if"] .ni-tag'); }
		function ifiItems() { return TA('[x-data="t_if_item"] .ifi-item'); }

		function mrIdxs() { return TA('[x-data="t_multi_root"] .mr-idx'); }
		function mrBtns() { return TA('[x-data="t_multi_root"] .mr-btn'); }
		function keItems() { return TA('[x-data="t_key_edge"] .ke-item'); }
		function raceItems() { return TA('[x-data="t_race"] .race-item'); }

		// ══════════════════════════════════════════════════════════════
		//  GRUPOS DE TESTES
		// ══════════════════════════════════════════════════════════════

		// ─────────────────────────────────────────────
		//  📋 x-bind — binding básico
		// ─────────────────────────────────────────────
		group('📋 x-bind — binding básico', [
			{
				name: 'Texto simples',
				fn: async () => {
					shadowProxy.template.t_bind.titulo = 'hello';
					await wait(20);
					assert(T('[x-data="t_bind"] .titulo').textContent.trim() === 'hello', 'esperado "hello"');
				}
			},
			{
				name: 'Número',
				fn: async () => {
					shadowProxy.template.t_bind.count = 42;
					await wait(20);
					assert(T('[x-data="t_bind"] .count').textContent.trim() === '42', 'esperado "42"');
				}
			},
			{
				name: 'Atualização reativa',
				fn: async () => {
					shadowProxy.template.t_bind.titulo = 'antes';
					await wait(10);
					shadowProxy.template.t_bind.titulo = 'depois';
					await wait(20);
					assert(T('[x-data="t_bind"] .titulo').textContent.trim() === 'depois', 'esperado "depois"');
				}
			},
			{
				name: 'Valor null renderiza vazio',
				fn: async () => {
					shadowProxy.template.t_bind.nulo = null;
					await wait(20);
					assert(T('[x-data="t_bind"] .nulo').textContent.trim() === '', 'esperado vazio');
				}
			},
			{
				name: 'Valor undefined renderiza vazio',
				fn: async () => {
					shadowProxy.template.t_bind.undef = undefined;
					await wait(20);
					assert(T('[x-data="t_bind"] .undef').textContent.trim() === '', 'esperado vazio');
				}
			},
			{
				name: 'Valor 0 renderiza "0" (não vazio)',
				fn: async () => {
					shadowProxy.template.t_bind.zero = 0;
					await wait(20);
					assert(T('[x-data="t_bind"] .zero').textContent.trim() === '0', 'esperado "0"');
				}
			},
			{
				name: 'Valor false renderiza "false"',
				fn: async () => {

					await wait(20);

				}

				name: 'Valor true renderiza "true"',

					await wait(20);

				}
			},
			{
				name: 'Interpolação em atributo href',

				}
			},
			{
				name: 'Interpolação em atributo data-*',
				fn: async () => {
					shadowProxy.template.t_bind.dataId = '99';
					await wait(20);
					assert(T('[x-data="t_bind"] .data-val').getAttribute('data-id') === '99', 'data-id errado');
				}
			},
			{
				name: 'x-bind em elemento aninhado fora de x-for',
				fn: async () => {
					shadowProxy.template.t_bind.nested = 'aninhado';
					await wait(20);
					assert(T('[x-data="t_bind"] .nested-span').textContent.trim() === 'aninhado', 'nested errado');
				}
			},
		]);

		// ─────────────────────────────────────────────
		//  🔁 x-for — lista básica
		// ─────────────────────────────────────────────
		group('🔁 x-for — lista básica', [
			{
				name: 'Render inicial',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'Alpha' }, { nome: 'Beta' }, { nome: 'Gamma' }];
					await wait(20);
					assert(listItems().length === 3, `esperado 3, got ${listItems().length}`);
					assert(listItems()[0].textContent.trim() === 'Alpha', 'item[0] errado');
					assert(listItems()[2].textContent.trim() === 'Gamma', 'item[2] errado');
				}
			},
			{
				name: 'push — adiciona no fim',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'A' }, { nome: 'B' }];
					await wait(20);
					shadowProxy.template.t_lista.lista.push({ nome: 'C' });
					await wait(20);
					assert(listItems().length === 3, 'esperado 3');
					assert(listItems()[2].textContent.trim() === 'C', 'item[2] errado');
				}
			},
			{
				name: 'unshift — adiciona no início',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'B' }, { nome: 'C' }];
					await wait(20);
					shadowProxy.template.t_lista.lista.unshift({ nome: 'A' });
					await wait(20);
					assert(listItems().length === 3, 'esperado 3');
					assert(listItems()[0].textContent.trim() === 'A', 'item[0] deveria ser A');
				}
			},
			{
				name: 'pop — remove do fim',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'A' }, { nome: 'B' }, { nome: 'C' }];
					await wait(20);
					shadowProxy.template.t_lista.lista.pop();
					await wait(20);
					assert(listItems().length === 2, 'esperado 2');
					assert(listItems()[1].textContent.trim() === 'B', 'último deve ser B');
				}
			},
			{
				name: 'shift — remove do início',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'A' }, { nome: 'B' }, { nome: 'C' }];
					await wait(20);
					shadowProxy.template.t_lista.lista.shift();
					await wait(20);
					assert(listItems().length === 2, 'esperado 2');
					assert(listItems()[0].textContent.trim() === 'B', 'primeiro deve ser B');
				}
			},
			{
				name: 'splice — remove do início',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'X' }, { nome: 'Y' }, { nome: 'Z' }];
					await wait(20);
					shadowProxy.template.t_lista.lista.splice(0, 1);
					await wait(20);
					assert(listItems().length === 2, `esperado 2, got ${listItems().length}`);
					assert(listItems()[0].textContent.trim() === 'Y', 'item[0] deveria ser Y');
				}
			},
			{
				name: 'splice — remove do meio',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'A' }, { nome: 'B' }, { nome: 'C' }];
					await wait(20);
					shadowProxy.template.t_lista.lista.splice(1, 1);
					await wait(20);
					assert(listItems().length === 2, 'esperado 2');
					assert(listItems()[1].textContent.trim() === 'C', 'item[1] deveria ser C');
				}
			},
			{
				name: 'sort — reordena',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'C' }, { nome: 'A' }, { nome: 'B' }];
					await wait(20);
					shadowProxy.template.t_lista.lista.sort((a, b) => a.nome.localeCompare(b.nome));
					await wait(20);
					assert(listItems()[0].textContent.trim() === 'A', 'item[0] deveria ser A');
					assert(listItems()[2].textContent.trim() === 'C', 'item[2] deveria ser C');
				}
			},
			{
				name: 'reverse — inverte',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'A' }, { nome: 'B' }, { nome: 'C' }];
					await wait(20);
					shadowProxy.template.t_lista.lista.reverse();
					await wait(20);

			{
				name: 'lista = [] — limpa tudo sem nós órfãos',

					const container = T('[x-data="t_lista"] [x-for]');
					assert(container.children.length === 0, 'nós órfãos no container');
				}
			},
			{
				name: 'Shuffle — reordena corretamente',
				fn: async () => {
					shadowProxy.template.t_lista.lista = [{ nome: 'A' }, { nome: 'B' }, { nome: 'C' }, { nome: 'D' }];
					await wait(20);
					shadowProxy.template.t_lista.lista = [{ nome: 'C' }, { nome: 'A' }, { nome: 'D' }, { nome: 'B' }];
					await wait(20);
					assert(listItems()[0].textContent.trim() === 'C', 'item[0] deveria ser C');

			{

				}
			},
		]);

		// ─────────────────────────────────────────────
		//  🔢 x-for — alias e índice
		// ─────────────────────────────────────────────
		group('🔢 x-for — alias e índice', [
			{
				name: 'Alias "item, k in lista" renderiza índice correto',
				fn: async () => {
					shadowProxy.template.t_for_idx.lista = [{ nome: 'A' }, { nome: 'B' }, { nome: 'C' }];

					await wait(20);
					const items = TA('[x-data="t_for_as"] .as-item');

					assert(items[1].textContent.trim() === '1:Y', `item[1] errado: ${items[1].textContent.trim()}`);

			},
			{
				name: '$i disponível no escopo sem alias',

					assert(bs[0].textContent.trim() === 'Y1', 'mf-b[0] errado');
				}
			},
		]);

		// ─────────────────────────────────────────────
		//  🔀 x-for aninhado
		// ─────────────────────────────────────────────
		group('🔀 x-for aninhado', [
			{
				name: 'Render inicial com subitens',
				fn: async () => {
					shadowProxy.template.t_nested.lista = [
						{ nome: 'Cat A', tags: [{ label: 'tag1' }, { label: 'tag2' }] },
						{ nome: 'Cat B', tags: [{ label: 'tag3' }] },

					await wait(30);
					assert(nestedCats().length === 2, `esperado 2 cats, got ${nestedCats().length}`);
					assert(nestedTags().length === 3, `esperado 3 tags, got ${nestedTags().length}`);
				}
			},
			{
				name: 'Nomes das categorias corretos',

					const nodesBefore = keItems();
					const nodeA = nodesBefore[0], nodeB = nodesBefore[1], nodeC = nodesBefore[2];
					shadowProxy.template.t_key_edge.lista = [{ id: 3, nome: 'C' }, { id: 1, nome: 'A' }, { id: 2, nome: 'B' }];
					await wait(20);
					const nodesAfter = keItems();
					assert(nodesAfter[0] === nodeC, 'nó C deveria ter sido movido, não recriado');
					assert(nodesAfter[1] === nodeA, 'nó A deveria ter sido movido, não recriado');
					assert(nodesAfter[2] === nodeB, 'nó B deveria ter sido movido, não recriado');
				}
			},
		]);

		// ─────────────────────────────────────────────
		//  ⚡ Race conditions / timing
		// ─────────────────────────────────────────────
		group('⚡ Race conditions / timing', [
			{
				name: 'Trocar lista 2x no mesmo tick — só a 2ª prevalece',
				fn: async () => {
					shadowProxy.template.t_race.lista = [{ nome: 'primeira' }];
					shadowProxy.template.t_race.lista = [{ nome: 'segunda' }, { nome: 'segunda2' }];
					await wait(30);
					assert(raceItems().length === 2, `esperado 2 itens, got ${raceItems().length}`);
					assert(raceItems()[0].textContent.trim() === 'segunda', `conteúdo errado: "${raceItems()[0].textContent.trim()}"`);
				}
			},
			{
				name: 'Múltiplos sets no mesmo componente no mesmo tick — 1 render',
				fn: async () => {
					shadowProxy.template.t_race2.val = 'inicial';
					await wait(20);
					const el = T('[x-data="t_race2"] .race2-out');
					let renders = 0;
					Object.defineProperty(el, 'textContent', {
						set(v) {
							renders++;
							Object.defineProperty(el, 'textContent', { writable: true, configurable: true });
							el.textContent = v;
						},
						configurable: true
					});
					shadowProxy.template.t_race2.val = 'v1';
					shadowProxy.template.t_race2.val = 'v2';
					shadowProxy.template.t_race2.val = 'v3';
					await wait(20);
					assert(renders === 1, `esperado 1 render, got ${renders}`);
					assert(el.textContent.trim() === 'v3', `conteúdo final errado: "${el.textContent.trim()}"`);
				}
			},
			{
				name: 'set → delete → set do mesmo prop no mesmo tick',
				fn: async () => {
					shadowProxy.template.t_race3.val = 'x';
					await wait(20);
					shadowProxy.template.t_race3.val = 'y';
					delete shadowProxy.template.t_race3.val;
					shadowProxy.template.t_race3.val = 'z';
					await wait(20);
					assert(T('[x-data="t_race3"] .race3-out').textContent.trim() === 'z',
						`esperado "z", got "${T('[x-data="t_race3"] .race3-out').textContent.trim()}"`);
				}
			},
		]);

		// ─────────────────────────────────────────────
		//  ♻️ Cache LRU — colisão entre componentes
		// ─────────────────────────────────────────────
		group('♻️ Cache LRU — colisão entre componentes', [
			{
				name: 'Mesma expressão em 2 componentes não colide',
				fn: async () => {
					shadowProxy.template.t_lru_a.compartilhado = 'valor-A';
					shadowProxy.template.t_lru_b.compartilhado = 'valor-B';
					await wait(20);
					assert(T('[x-data="t_lru_a"] .lru-a-out').textContent.trim() === 'valor-A',
						`t_lru_a errado: "${T('[x-data="t_lru_a"] .lru-a-out').textContent.trim()}"`);
					assert(T('[x-data="t_lru_b"] .lru-b-out').textContent.trim() === 'valor-B',
						`t_lru_b errado: "${T('[x-data="t_lru_b"] .lru-b-out').textContent.trim()}"`);
					shadowProxy.template.t_lru_a.compartilhado = 'valor-A2';
					await wait(20);
					assert(T('[x-data="t_lru_b"] .lru-b-out').textContent.trim() === 'valor-B',
						'mudança em t_lru_a vazou pro t_lru_b');
				}
			},
		]);

		// ─────────────────────────────────────────────
		//  🩺 Error handling / onError
		// ─────────────────────────────────────────────
		group('🩺 Error handling / onError', [
			{
				name: 'x-for com expressão inválida dispara onError e não trava o resto',
				fn: async () => {
					let captured = null;
					shadowProxy.onError = (err) => { captured = err; };
					shadowProxy.template.t_err_for.outro = 'sobrevivi';
					await wait(20);
					shadowProxy.onError = null;
					assert(captured && captured.type === 'x-for-syntax', `onError não disparou com tipo certo: ${JSON.stringify(captured)}`);
					assert(T('[x-data="t_err_for"] .ef-sibling').textContent.trim() === 'sobrevivi', 'sibling não renderizou');
				}
			},
			{
				name: 'x-bind com exceção em runtime não quebra render dos irmãos',
				fn: async () => {
					let captured = null;
					shadowProxy.onError = (err) => { captured = err; };
					shadowProxy.template.t_err_bind.bom = 'ok-irmao';
					await wait(20);
					shadowProxy.onError = null;
					assert(T('[x-data="t_err_bind"] .eb-good').textContent.trim() === 'ok-irmao', 'irmão não renderizou após erro no vizinho');
					assert(T('[x-data="t_err_bind"] .eb-bad').textContent.trim() === '', 'nó com erro deveria renderizar vazio, não travar');
				}
			},
		]);

		// ══════════════════════════════════════════════════════════════
		buildUI();
	</script>
</body>

</html>
