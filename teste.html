<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>shadow-proxy.min.js — Test Suite</title>
	<link
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap"
		rel="stylesheet">
	<script src="./assets/js/shadow-proxy.min.js"></script>
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--bg: #0a0a0f;
			--bg2: #111118;
			--bg3: #1a1a24;
			--border: #2a2a3a;
			--accent: #7c3aed;
			--accent2: #06b6d4;
			--danger: #ef4444;
			--success: #22c55e;
			--warn: #f59e0b;
			--text: #e2e8f0;
			--text2: #94a3b8;
			--text3: #475569;
			--font-mono: 'JetBrains Mono', monospace;
			--font-display: 'Syne', sans-serif;
		}

		body {
			background: var(--bg);
			color: var(--text);
			font-family: var(--font-mono);
			padding: 32px;
		}

		h1 {
			font-family: var(--font-display);
			font-size: 1.5rem;
			margin-bottom: 8px;
		}

		h1 span {
			color: var(--accent);
		}

		.subtitle {
			color: var(--text2);
			font-size: 0.75rem;
			margin-bottom: 32px;
		}

		.controls {
			display: flex;
			gap: 12px;
			margin-bottom: 32px;
			flex-wrap: wrap;
		}

		button {
			background: var(--accent);
			color: #fff;
			border: none;
			padding: 10px 20px;
			border-radius: 6px;
			font-family: var(--font-mono);
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
			transition: filter 0.15s;
		}

		button:hover {
			filter: brightness(1.2);
		}

		button.secondary {
			background: var(--bg3);
			border: 1px solid var(--border);
			color: var(--text);
		}

		.summary {
			display: flex;
			gap: 24px;
			margin-bottom: 24px;
			padding: 16px 20px;
			background: var(--bg2);
			border: 1px solid var(--border);
			border-radius: 10px;
		}

		.summary-item {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.summary-label {
			font-size: 0.65rem;
			color: var(--text3);
			text-transform: uppercase;
			letter-spacing: 0.1em;
		}

		.summary-value {
			font-size: 1.5rem;
			font-weight: 700;
			font-family: var(--font-display);
		}

		.summary-value.pass {
			color: var(--success);
		}

		.summary-value.fail {
			color: var(--danger);
		}

		.summary-value.total {
			color: var(--text);
		}

		.progress-bar {
			height: 4px;
			background: var(--bg3);
			border-radius: 2px;
			margin-bottom: 24px;
			overflow: hidden;
		}

		.progress-fill {
			height: 100%;
			background: var(--success);
			transition: width 0.3s;
		}

		.groups {
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.group {
			background: var(--bg2);
			border: 1px solid var(--border);
			border-radius: 10px;
			overflow: hidden;
		}

		.group-header {
			padding: 12px 20px;
			background: var(--bg3);
			border-bottom: 1px solid var(--border);
			display: flex;
			align-items: center;
			gap: 12px;
			font-family: var(--font-display);
			font-size: 0.85rem;
			font-weight: 600;
		}

		.group-badge {
			margin-left: auto;
			font-size: 0.7rem;
			font-family: var(--font-mono);
			color: var(--text2);
		}

		.test-list {
			padding: 8px 0;
		}

		.test-item {
			display: flex;
			align-items: flex-start;
			gap: 12px;
			padding: 10px 20px;
			border-bottom: 1px solid var(--border);
			font-size: 0.78rem;
		}

		.test-item:last-child {
			border-bottom: none;
		}

		.test-icon {
			font-size: 0.9rem;
			margin-top: 1px;
			flex-shrink: 0;
		}

		.test-name {
			flex: 1;
			color: var(--text);
		}

		.test-detail {
			font-size: 0.7rem;
			color: var(--text2);
			margin-top: 3px;
		}

		.test-time {
			font-size: 0.65rem;
			color: var(--text3);
			flex-shrink: 0;
			margin-top: 2px;
		}

		.status-pass .test-icon::before {
			content: '✓';
			color: var(--success);
		}

		.status-fail .test-icon::before {
			content: '✕';
			color: var(--danger);
		}

		.status-pending .test-icon::before {
			content: '○';
			color: var(--text3);
		}

		.status-running .test-icon::before {
			content: '◌';
			color: var(--warn);
		}

		.test-error {
			font-size: 0.7rem;
			color: var(--danger);
			margin-top: 4px;
			font-family: var(--font-mono);
		}

		/* Hidden DOM targets for tests */
		#test-targets {
			position: absolute;
			left: -9999px;
			top: 0;
			width: 1px;
			overflow: hidden;
		}
	</style>
</head>

<body>

	<!-- Hidden DOM targets -->
	<div id="test-targets">
		<div x-data="t_lista">
			<div x-for="item in lista">
				<div class="item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_nested">
			<div x-for="cat in lista">
				<div>
					<span class="cat-nome" x-bind="{cat.nome}"></span>
					<div x-for="tag in cat.tags">
						<span class="tag" x-bind="{tag.label}"></span>
					</div>
				</div>
			</div>
		</div>
		<div x-data="t_if">
			<div x-for="item in lista">
				<div>
					<span class="nome" x-bind="{item.nome}"></span>
					<span class="ativo" x-if="item.ativo">sim</span>
					<span class="inativo" x-if="!item.ativo">não</span>
				</div>
			</div>
		</div>
		<div x-data="t_bind">
			<span class="titulo" x-bind="titulo"></span>
			<span class="count" x-bind="count"></span>
		</div>
		<div x-data="t_model">
			<input type="text" x-model="t_model.nome">
			<input type="checkbox" x-model="t_model.ativo">
		</div>
		<div x-data="t_stress">
			<div x-for="item in lista">
				<div class="stress-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_stress1k">
			<div x-for="item in lista">
				<div class="stress1k-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_stress5k">
			<div x-for="item in lista">
				<div class="stress5k-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_multi_a">
			<div x-for="item in lista">
				<div class="multi-a-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_multi_b">
			<div x-for="item in lista">
				<div class="multi-b-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_multi_c">
			<div x-for="item in lista">
				<div class="multi-c-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_destroy_a">
			<div x-for="item in lista">
				<div class="destroy-a-item" x-bind="{item.nome}"></div>
			</div>
		</div>
		<div x-data="t_destroy_b">
			<span class="destroy-b-titulo" x-bind="titulo"></span>
		</div>
	</div>

	<h1>shadow-proxy<span>.js</span> — Test Suite</h1>
	<p class="subtitle">v2.5.0 · testes automatizados de reatividade</p>

	<div class="controls">
		<button onclick="runAll()">▶ Rodar todos</button>
		<button class="secondary" onclick="resetAll()">↺ Resetar</button>
	</div>

	<div class="summary">
		<div class="summary-item">
			<span class="summary-label">Total</span>
			<span class="summary-value total" id="s-total">0</span>
		</div>
		<div class="summary-item">
			<span class="summary-label">Pass</span>
			<span class="summary-value pass" id="s-pass">0</span>
		</div>
		<div class="summary-item">
			<span class="summary-label">Fail</span>
			<span class="summary-value fail" id="s-fail">0</span>
		</div>
		<div class="summary-item">
			<span class="summary-label">Tempo</span>
			<span class="summary-value total" id="s-time">—</span>
		</div>
	</div>

	<div class="progress-bar">
		<div class="progress-fill" id="progress" style="width:0%"></div>
	</div>
	<div class="groups" id="groups"></div>

	<script>
		// ── Test engine ──────────────────────────────────────────────────────────────

		const _results = { pass: 0, fail: 0, total: 0 };
		const _groups = [];

		function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

		function assert(condition, msg) {
			if (!condition) throw new Error(msg || 'assertion failed');
		}

		function getText(selector) {
			return document.querySelector(selector)?.textContent?.trim() ?? '';
		}

		function getAll(selector) {
			return [...document.querySelectorAll(selector)];
		}

		function group(name, tests) {
			_groups.push({ name, tests });
		}

		// ── DOM builder ──────────────────────────────────────────────────────────────

		function buildUI() {
			const container = document.getElementById('groups');
			container.innerHTML = '';
			_groups.forEach((g, gi) => {
				const el = document.createElement('div');
				el.className = 'group';
				el.innerHTML = `
            <div class="group-header">
                ${g.name}
                <span class="group-badge" id="gbadge-${gi}">— / ${g.tests.length}</span>
            </div>
            <div class="test-list" id="glist-${gi}">
                ${g.tests.map((t, ti) => `
                    <div class="test-item status-pending" id="t-${gi}-${ti}">
                        <span class="test-icon"></span>
                        <div style="flex:1">
                            <div class="test-name">${t.name}</div>
                            <div class="test-detail" id="td-${gi}-${ti}"></div>
                        </div>
                        <span class="test-time" id="tt-${gi}-${ti}"></span>
                    </div>
                `).join('')}
            </div>
        `;
				container.appendChild(el);
			});
			updateSummary();
		}

		function setTestStatus(gi, ti, status, detail, time) {
			const el = document.getElementById(`t-${gi}-${ti}`);
			el.className = `test-item status-${status}`;
			if (detail) document.getElementById(`td-${gi}-${ti}`).innerHTML = `<span class="${status === 'fail' ? 'test-error' : ''}">${detail}</span>`;
			if (time != null) document.getElementById(`tt-${gi}-${ti}`).textContent = `${time}ms`;
		}

		function updateSummary() {
			document.getElementById('s-total').textContent = _results.total;
			document.getElementById('s-pass').textContent = _results.pass;
			document.getElementById('s-fail').textContent = _results.fail;
			const pct = _results.total > 0 ? (_results.pass / _results.total * 100) : 0;
			document.getElementById('progress').style.width = pct + '%';
		}

		// ── Runner ────────────────────────────────────────────────────────────────────

		async function runAll() {
			_results.pass = 0; _results.fail = 0; _results.total = 0;
			buildUI();
			const start = performance.now();

			for (let gi = 0; gi < _groups.length; gi++) {
				const g = _groups[gi];
				let gPass = 0;

				for (let ti = 0; ti < g.tests.length; ti++) {
					const t = g.tests[ti];
					setTestStatus(gi, ti, 'running', '');
					await wait(30);

					const t0 = performance.now();
					try {
						await t.fn();
						const ms = Math.round(performance.now() - t0);
						setTestStatus(gi, ti, 'pass', 'ok', ms);
						_results.pass++;
						gPass++;
					} catch (e) {
						const ms = Math.round(performance.now() - t0);
						setTestStatus(gi, ti, 'fail', e.message, ms);
						_results.fail++;
					}
					_results.total++;
					updateSummary();
				}

				document.getElementById(`gbadge-${gi}`).textContent = `${gPass} / ${g.tests.length}`;
			}

			const total = Math.round(performance.now() - start);
			document.getElementById('s-time').textContent = total + 'ms';
		}

		function resetAll() {
			_results.pass = 0; _results.fail = 0; _results.total = 0;
			buildUI();
			document.getElementById('s-time').textContent = '—';
		}

		// ── Init proxy ────────────────────────────────────────────────────────────────

		proxy.initProxy();

		// ── Helpers de acesso ao DOM de teste ────────────────────────────────────────

		function listItems() { return getAll('#test-targets [x-data="t_lista"] .item'); }
		function nestedCats() { return getAll('#test-targets [x-data="t_nested"] .cat-nome'); }
		function nestedTags() { return getAll('#test-targets [x-data="t_nested"] .tag'); }
		function ifAtivos() { return getAll('#test-targets [x-data="t_if"] .ativo'); }
		function ifInativos() { return getAll('#test-targets [x-data="t_if"] .inativo'); }
		function stressItems() { return getAll('#test-targets [x-data="t_stress"] .stress-item'); }
		function stress1kItems() { return getAll('#test-targets [x-data="t_stress1k"] .stress1k-item'); }
		function stress5kItems() { return getAll('#test-targets [x-data="t_stress5k"] .stress5k-item'); }
		function multiAItems() { return getAll('#test-targets [x-data="t_multi_a"] .multi-a-item'); }
		function multiBItems() { return getAll('#test-targets [x-data="t_multi_b"] .multi-b-item'); }
		function multiCItems() { return getAll('#test-targets [x-data="t_multi_c"] .multi-c-item'); }
		function destroyAItems() { return getAll('#test-targets [x-data="t_destroy_a"] .destroy-a-item'); }
		function destroyBTitulo() { return document.querySelector('#test-targets [x-data="t_destroy_b"] .destroy-b-titulo'); }

		// ── GRUPOS DE TESTES ─────────────────────────────────────────────────────────

		group('📋 x-bind — binding básico', [
			{
				name: 'Texto simples',
				fn: async () => {
					proxy.template.t_bind.titulo = 'hello';
					await wait(10);
					assert(getText('[x-data="t_bind"] .titulo') === 'hello', 'esperado "hello"');
				}
			},
			{
				name: 'Número',
				fn: async () => {
					proxy.template.t_bind.count = 42;
					await wait(10);
					assert(getText('[x-data="t_bind"] .count') === '42', 'esperado "42"');
				}
			},
			{
				name: 'Atualização reativa',
				fn: async () => {
					proxy.template.t_bind.titulo = 'antes';
					await wait(10);
					proxy.template.t_bind.titulo = 'depois';
					await wait(10);
					assert(getText('[x-data="t_bind"] .titulo') === 'depois', 'esperado "depois"');
				}
			},
		]);

		group('🔁 x-for — lista básica', [
			{
				name: 'Render inicial',
				fn: async () => {
					proxy.template.t_lista.lista = [
						{ nome: 'Alpha' }, { nome: 'Beta' }, { nome: 'Gamma' }
					];
					await wait(20);
					assert(listItems().length === 3, `esperado 3, got ${listItems().length}`);
					assert(listItems()[0].textContent.trim() === 'Alpha', 'item[0] errado');
					assert(listItems()[2].textContent.trim() === 'Gamma', 'item[2] errado');
				}
			},
			{
				name: 'push — adiciona no fim',
				fn: async () => {
					proxy.template.t_lista.lista = [{ nome: 'A' }, { nome: 'B' }];
					await wait(20);
					proxy.template.t_lista.lista.push({ nome: 'C' });
					await wait(20);
					assert(listItems().length === 3, `esperado 3`);
					assert(listItems()[2].textContent.trim() === 'C', 'item[2] errado');
				}
			},
			{
				name: 'splice — remove do início',
				fn: async () => {
					proxy.template.t_lista.lista = [{ nome: 'X' }, { nome: 'Y' }, { nome: 'Z' }];
					await wait(20);
					proxy.template.t_lista.lista.splice(0, 1);
					await wait(20);
					assert(listItems().length === 2, `esperado 2, got ${listItems().length}`);
					assert(listItems()[0].textContent.trim() === 'Y', 'item[0] deveria ser Y');
				}
			},
			{
				name: 'splice — remove do meio',
				fn: async () => {
					proxy.template.t_lista.lista = [{ nome: 'A' }, { nome: 'B' }, { nome: 'C' }];
					await wait(20);
					proxy.template.t_lista.lista.splice(1, 1);
					await wait(20);
					assert(listItems().length === 2, `esperado 2`);
					assert(listItems()[1].textContent.trim() === 'C', 'item[1] deveria ser C');
				}
			},
			{
				name: 'lista = [] — limpa tudo',
				fn: async () => {
					proxy.template.t_lista.lista = [{ nome: 'A' }, { nome: 'B' }];
					await wait(20);
					proxy.template.t_lista.lista = [];
					await wait(20);
					assert(listItems().length === 0, `esperado 0, got ${listItems().length}`);
				}
			},
			{
				name: 'lista = novaLista — substitui tudo',
				fn: async () => {
					proxy.template.t_lista.lista = [{ nome: 'Old1' }, { nome: 'Old2' }];
					await wait(20);
					proxy.template.t_lista.lista = [{ nome: 'New1' }, { nome: 'New2' }, { nome: 'New3' }];
					await wait(20);
					assert(listItems().length === 3, `esperado 3`);
					assert(listItems()[0].textContent.trim() === 'New1', 'item[0] errado');
				}
			},
			{
				name: 'Shuffle — reordena corretamente',
				fn: async () => {
					proxy.template.t_lista.lista = [
						{ nome: 'A' }, { nome: 'B' }, { nome: 'C' }, { nome: 'D' }
					];
					await wait(20);
					const shuffled = [{ nome: 'C' }, { nome: 'A' }, { nome: 'D' }, { nome: 'B' }];
					proxy.template.t_lista.lista = shuffled;
					await wait(20);
					assert(listItems()[0].textContent.trim() === 'C', 'item[0] deveria ser C');
					assert(listItems()[3].textContent.trim() === 'B', 'item[3] deveria ser B');
				}
			},
			{
				name: 'Atualiza item específico (lista[1].nome)',
				fn: async () => {
					proxy.template.t_lista.lista = [{ nome: 'Antes' }, { nome: 'Meio' }, { nome: 'Fim' }];
					await wait(20);
					proxy.template.t_lista.lista[1].nome = 'Mudou';
					await wait(20);
					assert(listItems()[1].textContent.trim() === 'Mudou', 'item[1] não atualizou');
				}
			},
		]);

		group('🔀 x-for aninhado', [
			{
				name: 'Render inicial com subitens',
				fn: async () => {
					proxy.template.t_nested.lista = [
						{ nome: 'Cat A', tags: [{ label: 'tag1' }, { label: 'tag2' }] },
						{ nome: 'Cat B', tags: [{ label: 'tag3' }] },
					];
					await wait(30);
					assert(nestedCats().length === 2, `esperado 2 cats, got ${nestedCats().length}`);
					assert(nestedTags().length === 3, `esperado 3 tags, got ${nestedTags().length}`);
				}
			},
			{
				name: 'Nomes das categorias corretos',
				fn: async () => {
					proxy.template.t_nested.lista = [
						{ nome: 'Frutas', tags: [{ label: 'maçã' }] },
						{ nome: 'Verduras', tags: [{ label: 'alface' }, { label: 'couve' }] },
					];
					await wait(30);
					assert(nestedCats()[0].textContent.trim() === 'Frutas', 'cat[0] errado');
					assert(nestedCats()[1].textContent.trim() === 'Verduras', 'cat[1] errado');
				}
			},
			{
				name: 'Tags corretas por categoria',
				fn: async () => {
					proxy.template.t_nested.lista = [
						{ nome: 'X', tags: [{ label: 'alpha' }, { label: 'beta' }] },
						{ nome: 'Y', tags: [{ label: 'gamma' }] },
					];
					await wait(30);
					const tags = nestedTags().map(t => t.textContent.trim());
					assert(tags[0] === 'alpha', `tag[0] errado: ${tags[0]}`);
					assert(tags[1] === 'beta', `tag[1] errado: ${tags[1]}`);
					assert(tags[2] === 'gamma', `tag[2] errado: ${tags[2]}`);
				}
			},
			{
				name: 'Adicionar tag em cat existente',
				fn: async () => {
					proxy.template.t_nested.lista = [
						{ nome: 'Cat', tags: [{ label: 'A' }] }
					];
					await wait(30);
					proxy.template.t_nested.lista[0].tags.push({ label: 'B' });
					await wait(30);
					assert(nestedTags().length === 2, `esperado 2 tags, got ${nestedTags().length}`);
					assert(nestedTags()[1].textContent.trim() === 'B', 'tag[1] errado');
				}
			},
			{
				name: 'Remover categoria',
				fn: async () => {
					proxy.template.t_nested.lista = [
						{ nome: 'A', tags: [{ label: 'x' }] },

		group('🔬 Granularidade — prova do render cirúrgico', [
			{
				name: 'Update pontual toca apenas 1 nó (de 500)',
				fn: async () => {
					// Instrumenta: conta quantos nós tiveram textContent escrito
					proxy.template.t_stress.lista = Array.from({ length: 500 }, (_, i) => ({ nome: `G${i}` }));
					await wait(50);

					let renderCount = 0;
					stressItems().forEach(el => {
						const orig = Object.getOwnPropertyDescriptor(el, 'textContent');
						Object.defineProperty(el, 'textContent', {
							set(v) {
								renderCount++;
								// Restaura descritor original antes de setar
								Object.defineProperty(el, 'textContent', orig || {
									writable: true, configurable: true, enumerable: true
								});
								el.textContent = v;
							},
							configurable: true
						});
					});

					proxy.template.t_stress.lista[100].nome = 'Cirúrgico';
					await wait(20);

					assert(renderCount === 1, `esperado 1 nó renderizado, got ${renderCount}`);
					assert(stressItems()[100].textContent.trim() === 'Cirúrgico', 'conteúdo errado');
				}
			},
			{
				name: '10 updates aleatórios tocam exatamente 10 nós',
				fn: async () => {
					proxy.template.t_stress.lista = Array.from({ length: 500 }, (_, i) => ({ nome: `H${i}` }));
					await wait(50);

					let renderCount = 0;
					stressItems().forEach(el => {
						Object.defineProperty(el, 'textContent', {
							set(v) {
								renderCount++;
								Object.defineProperty(el, 'textContent', { writable: true, configurable: true, enumerable: true });
								el.textContent = v;
							},
							configurable: true
						});
					});

					const indices = [10, 50, 100, 150, 200, 250, 300, 350, 400, 450];
					indices.forEach(i => { proxy.template.t_stress.lista[i].nome = `U${i}`; });
					await wait(20);

					assert(renderCount === 10, `esperado 10 nós renderizados, got ${renderCount}`);
				}
			},
		]);

		group('💣 destroy — lifecycle', [
			{
				name: 'proxy.destroy(key) — limpa store',
				fn: async () => {
					proxy.template.t_destroy_a.lista = [{ nome: 'X' }, { nome: 'Y' }];
					await wait(20);
					assert(destroyAItems().length === 2, 'pré-condição: esperado 2 itens');
					proxy.destroy('t_destroy_a');
					await wait(10);
					// store limpo: proxy.template.t_destroy_a deve ser objeto vazio
					const raw = proxy.template.t_destroy_a;
					assert(!raw.lista, 'store deveria estar limpo após destroy');
				}
			},
			{
				name: 'proxy.template.key.destroy() — shortcut funciona',
				fn: async () => {
					proxy.template.t_destroy_b.titulo = 'antes';
					await wait(10);
					proxy.template.t_destroy_b.destroy();
					await wait(10);
					const raw = proxy.template.t_destroy_b;
					assert(!raw.titulo, 'store deveria estar limpo via shortcut destroy');
				}
			},
			{
				name: '$beforeDestroy hook é chamado',
				fn: async () => {
					proxy.template.t_destroy_a.lista = [{ nome: 'Hook' }];
					await wait(10);
					let called = false;
					proxy.template.t_destroy_a.$beforeDestroy = function (el) { called = true; };
					proxy.destroy('t_destroy_a');
					await wait(10);
					assert(called, '$beforeDestroy não foi chamado');
				}
			},
			{
				name: '$afterDestroy hook é chamado',
				fn: async () => {
					proxy.template.t_destroy_b.titulo = 'after-test';
					await wait(10);
					let called = false;
					proxy.template.t_destroy_b.$afterDestroy = function (el) { called = true; };
					proxy.destroy('t_destroy_b');
					await wait(10);
					assert(called, '$afterDestroy não foi chamado');
				}
			},
			{
				name: 'evento before-destroy dispara no elemento',
				fn: async () => {
					proxy.template.t_destroy_a.lista = [{ nome: 'Ev' }];
					await wait(10);
					let fired = false;
					const el = document.querySelector('[x-data="t_destroy_a"]');
					const handler = () => { fired = true; };
					el.addEventListener('before-destroy', handler);
					proxy.destroy('t_destroy_a');
					await wait(10);
					el.removeEventListener('before-destroy', handler);
					assert(fired, 'evento before-destroy não disparou');
				}
			},
			{
				name: 'evento after-destroy dispara no elemento',
				fn: async () => {
					proxy.template.t_destroy_b.titulo = 'ev2';
					await wait(10);
					let fired = false;
					const el = document.querySelector('[x-data="t_destroy_b"]');
					const handler = () => { fired = true; };
					el.addEventListener('after-destroy', handler);
					proxy.destroy('t_destroy_b');
					await wait(10);
					el.removeEventListener('after-destroy', handler);
					assert(fired, 'evento after-destroy não disparou');
				}
			},
			{
				name: 'watcher removido após destroy — não dispara mais',
				fn: async () => {
					proxy.template.t_destroy_a.lista = [];
					await wait(10);
					let watchCount = 0;
					proxy.on('t_destroy_a.lista', () => { watchCount++; });
					proxy.destroy('t_destroy_a');
					await wait(10);
					// Após destroy, o watcher foi removido junto com o key
					// Reinicia e seta lista — não deve disparar o watcher antigo
					proxy.template.t_destroy_a.lista = [{ nome: 'pós-destroy' }];
					await wait(10);
					assert(watchCount === 0, `watcher disparou ${watchCount}x após destroy`);
				}
			},
			{
				name: 'ciclo fetch — destroy → reinit → reativa normalmente',
				fn: async () => {
					// Simula carregamento inicial
					proxy.template.t_destroy_b.titulo = 'original';
					await wait(10);
					// Destroy (simula troca de página via fetch)
					proxy.destroy('t_destroy_b');
					await wait(10);
					// Reinit (simula novo conteúdo injetado e proxy.initProxy() chamado)
					proxy.initProxy();
					await wait(10);
					// Seta novo valor — DOM deve reagir
					proxy.template.t_destroy_b.titulo = 'reativado';
					await wait(20);
					const el = document.querySelector('[x-data="t_destroy_b"] .destroy-b-titulo');
					assert(el && el.textContent.trim() === 'reativado', `esperado "reativado", got "${el ? el.textContent.trim() : 'null'}"`);
				}
			},
		]);
